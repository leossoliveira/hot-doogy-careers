# careers.hotdoogy.com — static careers site (Vite build in /var/www/hot-doogy-careers).
# Installed at /etc/nginx/sites-available/hot-doogy-careers and linked from sites-enabled.
limit_req_zone $binary_remote_addr zone=hot_doogy_careers:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name careers.hotdoogy.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hot-doogy-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://careers.hotdoogy.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name careers.hotdoogy.com;
    ssl_certificate /etc/letsencrypt/live/careers.hotdoogy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careers.hotdoogy.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HotDoogyCareersTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    root /var/www/hot-doogy-careers;
    index index.html;
    limit_req zone=hot_doogy_careers burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;

    # The browser only talks to this origin and to the Supabase Edge Function.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://kfnsfnytnnpwptklmbip.supabase.co; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    if ($host != careers.hotdoogy.com) { return 444; }

    # Hashed build assets never change; the HTML must always be fresh.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://kfnsfnytnnpwptklmbip.supabase.co; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
