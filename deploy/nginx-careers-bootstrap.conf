# Stage 1, before the certificate exists: answers the ACME challenge and serves the
# site over plain HTTP so DNS and the files can be checked. Replace with
# nginx-careers.conf as soon as certbot has issued the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name careers.hotdoogy.com;
    root /var/www/hot-doogy-careers;
    index index.html;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hot-doogy-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
